# MLflow (Postgres backend) + Grafana — 벤치 결과 기록·추이 모니터링
#   usage:  cp .env.example .env  (비밀번호 수정)  →  docker compose up -d --build
#   MLflow  : http://<server>:5000   (CI 는 MLFLOW_TRACKING_URI 로 여기에 기록)
#   Grafana : http://<server>:3000   (MLflow 의 Postgres 를 직접 읽어 커밋별 추이 표시)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./grafana/readonly-user.sh:/docker-entrypoint-initdb.d/10-readonly-user.sh:ro
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 10

  mlflow:
    build: ./mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 기본값은 localhost + 사설 IP 만 허용. 호스트명으로 접속하면 여기에 추가.
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-}
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
    # 공인 IP 노출 방지: BIND_IP(예: Tailscale IP)에만 바인딩
    ports:
      - "${BIND_IP:-127.0.0.1}:5000:5000"
    volumes:
      - mlartifacts:/mlartifacts

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  mlartifacts:
  grafana:

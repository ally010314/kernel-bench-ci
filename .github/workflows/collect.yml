name: experiment-collect

# 네 장비의 실험 결과를 MLflow experiment gpu-study/* 에 모으고, expctl 로 띄운 실험을 판정한다. 같은 측정은 src_id 로 찾아 내용이 바뀌었을 때만 교체한다.
# 커널 벤치(bench.yml)와 경로가 겹치지 않아 이 워크플로를 고쳐도 측정이 돌지 않는다.
on:
  schedule:
    - cron: "7,37 * * * *"
  pull_request:
    paths: ["experiments/**", ".github/workflows/collect.yml"]
  workflow_dispatch:

concurrency:
  group: experiment-collect
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  collect:
    # Orin runner 는 서버 ssh 키와 ~/<workdir> 를 함께 가진다. GPU 를 쓰지 않는다.
    runs-on: [self-hosted, orin]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Collect
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: python3 experiments/collect.py
      # 수집이 실패해도 실험 판정은 돈다. 실패한 실험은 issue 를 한 번 연다.
      - name: Judge experiments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/expctl.py judge --issue
